name: Daily Job Scrape

on:
  schedule:
    - cron: '0 2 * * 2,4'  # Tuesdays and Thursdays at 2:00am UTC
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p json data

      - name: Run scrapers
        run: python main.py

      - name: Run extraction
        run: python extract.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MASTER_JOBS_PATH: data/master_jobs.json

      - name: Sync jobs bridge for web/public
        run: ./scripts/sync_master_jobs_bridge.sh

      - name: Check jobs bridge drift
        run: ./scripts/check_master_jobs_bridge.sh

      - name: Commit updated master_jobs.json
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/master_jobs.json web/public/data/master_jobs.json data/extraction_cache.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update jobs data $(date +'%Y-%m-%d')"
          git push
