name: Personalized Email Digest

on:
  schedule:
    - cron: "30 7 * * *" # Daily 07:30 UTC
  workflow_dispatch:

jobs:
  personalized:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync delivery segments
        run: python scripts/sync_delivery_segments.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_WEEKLY_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_PERSONALIZED_LIST_ID: ${{ secrets.BREVO_PERSONALIZED_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_CTA_URL: ${{ secrets.EMAIL_CTA_URL }}

      - name: Send personalized digest
        run: python scripts/personalized_digest.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_WEEKLY_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_PERSONALIZED_LIST_ID: ${{ secrets.BREVO_PERSONALIZED_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_CTA_URL: ${{ secrets.EMAIL_CTA_URL }}
          MASTER_JOBS_PATH: data/master_jobs.json
