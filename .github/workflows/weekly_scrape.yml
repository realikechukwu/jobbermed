name: Weekly Job Scrape

on:
  schedule:
    - cron: '0 9 * * 2'  # Tuesdays at 09:00 UTC
  workflow_dispatch:
    inputs:
      send:
        description: Send the newsletter to the existing weekly Brevo list
        type: boolean
        default: false

concurrency:
  group: jobbermed-weekly-newsletter
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v5
      
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Sync weekly list exclusions for personalized users
        if: github.event_name == 'schedule' || inputs.send
        run: python scripts/sync_delivery_segments.py
        continue-on-error: true
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_WEEKLY_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_PERSONALIZED_LIST_ID: ${{ secrets.BREVO_PERSONALIZED_LIST_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EMAIL_CTA_URL: ${{ secrets.EMAIL_CTA_URL }}

      - name: Send weekly newsletter
        run: python newsletter.py
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ secrets.BREVO_LIST_ID }}
          BREVO_EXPECTED_LIST_ID: '5'
          BREVO_SENDER_EMAIL: ${{ secrets.BREVO_SENDER_EMAIL }}
          BREVO_SENDER_NAME: ${{ secrets.BREVO_SENDER_NAME }}
          EMAIL_CTA_URL: ${{ secrets.EMAIL_CTA_URL }}
          MASTER_JOBS_PATH: data/master_jobs.json
          NEWSLETTER_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.send }}
